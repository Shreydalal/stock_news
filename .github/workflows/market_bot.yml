name: Daily Market Intelligence Bot Run

on:
  schedule:
    # Runs everyday at 13:30 UTC (7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch:
    # Allows manual runs from the GitHub Actions Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      # Give the action write permissions to commit changes back to the repository
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest -v

      - name: Execute Daily Market Bot Pipeline
        env:
          # Database connection
          # We use the repository's local SQLite database. The action commits the updated db back to the repo.
          # Alternatively, you can define DATABASE_URL in GitHub Secrets to connect to a live Supabase DB.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./market_intelligence.db' }}
          
          # Groq API key for report generation
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
          # Telegram Alerts (Optional)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # SMTP Email Setup (Optional)
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # Runs the daily orchestrator script
          python -c "from app.scheduler.scheduler import run_daily_pipeline; run_daily_pipeline()"

      - name: Commit and Push Generated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ market_intelligence.db || true
          git commit -m "Daily market report $(date +'%Y-%m-%d') [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
